name: Build & Distribute DB Tools Container

permissions:
  contents: read
  packages: write

run-name: ${{ github.actor }} is building and distributing a new DB tools container.
on:
  workflow_dispatch:
  push:
    paths:
    - docker/db/Dockerfile
    - db/**
    tags:
    - release/**

jobs:

  package:
    runs-on: ubuntu-latest

    steps:

    # Checkout the current Git repository.
    - name: 'Git Checkout'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Authorize with the configured container registry hosting the OCI charts.
    - name: 'Set up Docker Buildx'
      uses: docker/setup-buildx-action@v3

    - name: 'Authorize with the container registry'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Read artifact version'
      id: version
      run: echo "value=$(< VERSION)" >> "$GITHUB_OUTPUT"

    - name: 'Build the db tooling container'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/db/Dockerfile
        push: true
        tags: ghcr.io/peinser/xarta/db:${{ steps.version.outputs.value }}
