name: Build & Distribute Core

permissions:
  contents: read
  packages: write

run-name: ${{ github.actor }} is building a new container for Core.

on:
  workflow_dispatch:
  push:
    paths:
    - src/xarta/**
    - src/xarta/**
    - docker/core/Dockerfile
    tags:
    - release/**

jobs:

  package:
    runs-on: ubuntu-latest

    steps:
    # Checkout the current Git repository.
    - name: 'Git Checkout'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 'Set up Docker Buildx'
      uses: docker/setup-buildx-action@v3

    - name: 'Validate the core application'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/core/Dockerfile
        target: validate
        push: false

    - name: 'Authorize with the container registry'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Read artifact version'
      id: version
      run: echo "value=$(< VERSION)" >> "$GITHUB_OUTPUT"

    # Package the repository
    - name: 'Package the core application'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/core/Dockerfile
        target: production
        push: true
        tags: ghcr.io/peinser/xarta/core:${{ steps.version.outputs.value }}
