{{- if and .Values.defaults.ingress.enabled .Values.services.mcp.enabled .Values.services.mcp.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    {{- include "ingress.defaultAnnotations" $ | indent 4 }}
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  name: {{ .Release.Name }}-api-mcp
spec:
  ingressClassName: {{ .Values.defaults.ingress.ingressClassName | quote }}
  tls:
  - hosts:
    {{- range $host := .Values.defaults.ingress.hosts }}
    {{- if $host.tls }}
    - {{ $host.dns | quote }}
    {{- end }}
    {{- end }}
    secretName: {{ .Release.Name }}-ingress-tls
  rules:
  {{- range $host := .Values.defaults.ingress.hosts }}
  - host: {{ $host.dns | quote }}
    http:
      paths:
      - path: /api/mcp
        pathType: Exact
        backend:
          service:
            name: {{ $.Release.Name }}-service-mcp
            port:
              number: 80
  {{- end }}
{{- end }}
