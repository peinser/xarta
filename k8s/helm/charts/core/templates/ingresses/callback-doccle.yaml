{{- if and .Values.defaults.ingress.enabled .Values.services.doccle.enabled .Values.services.doccle.settings.callbacks.enabled .Values.services.doccle.callbackIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    {{- include "ingress.defaultAnnotations" $ | indent 4 }}
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: {{ printf "%s/%s" .Release.Namespace (required "services.doccle.callbackIngress.clientCertificateAuthoritySecret is required" .Values.services.doccle.callbackIngress.clientCertificateAuthoritySecret) | quote }}
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
  name: {{ .Release.Name }}-callback-doccle
spec:
  ingressClassName: {{ .Values.defaults.ingress.ingressClassName | quote }}
  tls:
  - hosts:
    {{- range $v := .Values.defaults.ingress.hosts }}
    {{- if $v.tls }}
    - {{ $v.dns | quote }}
    {{- end }}
    {{- end }}
    secretName: {{ .Release.Name }}-ingress-tls
  rules:
  {{- range $v := .Values.defaults.ingress.hosts }}
  - host: {{ $v.dns | quote }}
    http:
      paths:
      - path: /api/doccle/callbacks
        pathType: Prefix
        backend:
          service:
            name: {{ $.Release.Name }}-service-doccle
            port:
              number: 80
      - path: /api/v1/doccle/callbacks
        pathType: Prefix
        backend:
          service:
            name: {{ $.Release.Name }}-service-doccle
            port:
              number: 80
  {{- end }}
{{- end }}
