{{- range $owner := list "tracking" "doccle" "archive" }}
{{- $key := printf "%sPostgresql" $owner }}
{{- $settings := mergeOverwrite (deepCopy $.Values.database.postgresql) (get $.Values.database $key | default dict) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-core-{{ $owner }}-postgresql
data:
  user: {{ required (printf "database.%s.user is required" $key) $settings.user | b64enc | quote }}
  database: {{ required (printf "database.%s.database is required" $key) $settings.database | b64enc | quote }}
  password: {{ required (printf "database.%s.password is required" $key) $settings.password | b64enc | quote }}
  host: {{ required (printf "database.%s.host is required" $key) $settings.host | b64enc | quote }}
{{- end }}
