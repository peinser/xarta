{{ if .Values.services.documenttype.enabled }}

{{- $deployment := include "service.name" (dict "release" $.Release "name" "documenttype") }}

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ $deployment }}
    xarta-environment: {{ .Release.Name }}
  name: {{ $deployment }}
spec:
  replicas: {{ include "deploy.replicas" .Values.services.documenttype }}
  selector:
    matchLabels:
      app: {{ $deployment }}
  template:
    metadata:
      annotations:
        # The following configuration forces the deployment to reconfigure whenever the cache configuration has been modified.
        checksum-config-cache: {{ include (print $.Template.BasePath "/config-maps/cache.yaml") . | sha256sum }}
      labels:
        app: {{ $deployment }}
        xarta-environment: {{ .Release.Name }}
        {{- if .Values.defaults.loki.enabled }}
        loki: {{ .Values.defaults.loki.tenant }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: {{ .Values.defaults.securityContext.runAsUser }}
        runAsGroup: {{ .Values.defaults.securityContext.runAsGroup }}
        fsGroup: {{ .Values.defaults.securityContext.fsGroup }}

      {{- include "service.constraints" $ | nindent 6 }}

      dnsPolicy: {{ .Values.defaults.dnsPolicy }}
      restartPolicy: {{ .Values.defaults.restartPolicy }}
      {{ include "service.pullSecrets" $ | nindent 6 -}}

      volumes:
      - name: cache
        configMap:
          name: {{ printf "%s-cache" .Release.Name }}
          items:
          - key: cache.json
            path: cache.json

      containers:

      - image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ include "image" $ }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: {{ $deployment }}
        securityContext:
          allowPrivilegeEscalation: {{ .Values.defaults.securityContext.allowPrivilegeEscalation }}
          privileged: {{ .Values.defaults.securityContext.privileged }}
          runAsNonRoot: {{ .Values.defaults.securityContext.runAsNonRoot }}
        args: [
          "services",
          {{ if $.Values.image.debug -}}
          --debug,
          {{- end }}
          "--run", "documenttype=latest",
          "--run", "documenttype=v1"
        ]

        volumeMounts:
        - name: cache
          readOnly: true
          mountPath: /mnt/config/cache.json
          subPath: cache.json

        ports:
        - containerPort: 8000
          protocol: TCP

        env:
        {{- include "telemetry.env" (dict "root" $ "name" "document-type") | nindent 8 }}
        - name: CACHE_CONFIG_PATH
          value: "/mnt/config/cache.json"
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: {{ $.Release.Name }}-core-postgresql
              key: user
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $.Release.Name }}-core-postgresql
              key: password
        - name: POSTGRESQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: {{ $.Release.Name }}-core-postgresql
              key: database
        - name: POSTGRESQL_HOST
          valueFrom:
            secretKeyRef:
              name: {{ $.Release.Name }}-core-postgresql
              key: host

        {{- include "resources" $ | nindent 8 }}
        {{- include "probes" $ | nindent 8 }}

{{- end }}
